<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Aprentix · Tu oposición, a tu ritmo</title>

  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="application-name" content="Aprentix">
  <meta name="theme-color" content="#6B8E23" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101E1A" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Aprentix">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="/icons/icon-any.svg">
  <link rel="mask-icon" href="/icons/icon-mono.svg" color="#6B8E23">

  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="style.css">

  <script>
    (function () {
      var m = document.cookie.match(/(?:^|;\s*)aprentix_theme=(dark|light)/);
      var theme = m ? m[1] : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    })();
  </script>

  <script src="session.js"></script>
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>

  <div id="app" class="app-root"></div>

  <!-- ─────────────────────── AUTH ─────────────────────── -->
  <template id="tpl-auth">
    <div class="auth-view">
      <header class="auth-hero">
        <img class="brand-logo" src="/logo.svg" alt="Aprentix">
        <h1>Aprentix</h1>
        <p class="tagline">Tu oposición, a tu ritmo.</p>
      </header>

      <div class="auth-card">
        <div class="auth-tabs" role="tablist">
          <button class="auth-tab active" data-tab="login" role="tab">Entrar</button>
          <button class="auth-tab"        data-tab="register" role="tab">Crear cuenta</button>
        </div>

        <form data-panel="login" class="auth-panel active" autocomplete="on" novalidate>
          <label>
            <span>Correo electrónico</span>
            <input name="email" type="email" autocomplete="email" inputmode="email" required>
          </label>
          <label>
            <span>Contraseña</span>
            <input name="password" type="password" autocomplete="current-password" required>
          </label>
          <button class="btn btn-primary btn-block" type="submit">Entrar</button>
          <p class="auth-err" data-err hidden></p>
          <p class="auth-forgot">
            <button type="button" data-reenviar>¿No has recibido el correo?</button>
            <br>
            <button type="button" data-olvidada>¿Olvidaste la contraseña?</button>
          </p>
        </form>

        <form data-panel="register" class="auth-panel" autocomplete="off" novalidate>
          <label>
            <span>Nombre</span>
            <input name="nombre" type="text" autocomplete="name" required>
          </label>
          <label>
            <span>Correo electrónico</span>
            <input name="email" type="email" autocomplete="email" inputmode="email" required>
          </label>
          <label>
            <span>Repite el correo</span>
            <input name="email2" type="email" autocomplete="email" inputmode="email" required>
          </label>
          <p class="mini-hint" data-email-match hidden></p>

          <label>
            <span>Contraseña</span>
            <input name="password" type="password" autocomplete="new-password" minlength="8" required>
          </label>
          <div class="pw-strength" data-pw-strength>
            <div class="pw-strength-bar"><span data-pw-fill></span></div>
            <span class="pw-strength-label" data-pw-label>Introduce una contraseña</span>
          </div>

          <label>
            <span>Repite la contraseña</span>
            <input name="password2" type="password" autocomplete="new-password" minlength="8" required>
          </label>
          <p class="mini-hint" data-pw-match hidden></p>

          <button class="btn btn-primary btn-block" type="submit">Crear cuenta</button>
          <p class="auth-err" data-err hidden></p>
          <p class="auth-mini">
            Al continuar aceptas recibir un correo de verificación desde
            <strong>no-reply@aprentix.es</strong>.
          </p>
        </form>
      </div>
    </div>
  </template>

  <!-- ─────────────────────── HOME ─────────────────────── -->
  <template id="tpl-home">
    <section class="view view-home">
      <header class="top-bar">
        <img class="brand-mini" src="/logo.svg" alt="Aprentix">
        <button class="chip chip-level" data-open-perfil>
          <span class="chip-ico">🌿</span><span data-nivel>Nivel 1</span>
        </button>
        <button class="chip chip-racha" data-goto="stats">
          <span class="chip-ico">🔥</span><strong data-racha>0</strong> días
        </button>
        <button class="avatar-btn" data-open-perfil aria-label="Perfil">
          <span class="avatar" data-avatar>?</span>
        </button>
      </header>

      <!-- Oposición activa (clickable → modal con listado + añadir otra). -->
      <button class="opos-activa" data-opos-activa>
        <span class="opos-activa-ico">📚</span>
        <span class="opos-activa-txt">
          <span class="muted small">Estudiando</span>
          <strong data-opos-nombre>—</strong>
        </span>
        <span class="opos-activa-caret" aria-hidden="true">▾</span>
      </button>

      <div class="hero home-hero">
        <h1 data-home-saludo>Hola</h1>
        <p class="muted" data-home-sub>Un pequeño avance hoy suma mucho a la larga.</p>
      </div>

      <button class="btn btn-primary btn-block btn-estudiar" data-abrir-estudiar>
        <span class="btn-estudiar-ico">▶</span>
        <span>
          <strong>Estudiar</strong>
          <em class="muted small" data-estudiar-sub>Modo estudio guiado con cronómetro</em>
        </span>
      </button>

      <!-- Resumen semanal (aparece solo cuando hay datos: primera Home
           tras el domingo con cierre semanal). -->
      <article class="card card-resumen-semanal" data-resumen-semanal hidden>
        <div class="rs-ico">📊</div>
        <div class="rs-txt">
          <span class="chip chip-soft">Resumen de la semana</span>
          <p data-rs-mensaje class="rs-mensaje">—</p>
          <div class="rs-stats">
            <span><strong data-rs-min>0m</strong><span class="muted small">estudiadas</span></span>
            <span><strong data-rs-obj>0%</strong><span class="muted small">objetivos</span></span>
            <span><strong data-rs-prec>0%</strong><span class="muted small">precisión</span></span>
          </div>
        </div>
      </article>

      <!-- Plan de hoy compacto — SIN duplicar los stats del perfil/estadísticas. -->
      <article class="card card-hoy">
        <div class="card-head">
          <h2><span class="section-sun" aria-hidden="true">🌤</span> Plan de hoy</h2>
          <button class="chip chip-outline" data-goto="plan">
            <span class="chip-ico">📅</span> Ver semana
          </button>
        </div>
        <div class="progress progress-lg progress-hoy">
          <span class="progress-title">
            <span data-hoy-done>0</span> de <span data-hoy-tot>0</span> bloques hechos
          </span>
          <div class="progress-bar"><span data-hoy-fill style="width:0%"></span></div>
          <span class="progress-label"><span data-hoy-pct>0</span>%</span>
        </div>
        <ul class="list list-hoy" data-hoy></ul>
      </article>
    </section>
  </template>

  <!-- ─────────────────────── MODAL: oposiciones matriculadas ─────────────────────── -->
  <template id="tpl-modal-oposiciones">
    <div class="modal-backdrop" data-modal>
      <div class="modal">
        <button class="modal-close" data-modal-close aria-label="Cerrar">×</button>
        <h2>Tus oposiciones</h2>
        <p class="muted small">La marcada es la activa. Toca otra para cambiar.</p>
        <ul class="opos-lista" data-opos-lista></ul>
        <button class="btn btn-outline btn-block" data-opos-add style="margin-top:var(--sp-3)">
          ➕ Añadir otra oposición
        </button>
      </div>
    </div>
  </template>

  <!-- ─────────────────────── PLAN ─────────────────────── -->
  <template id="tpl-plan">
    <section class="view view-plan">
      <header class="top-bar">
        <img class="brand-mini" src="/logo.svg" alt="Aprentix">
        <button class="chip chip-level" data-open-perfil>
          <span class="chip-ico">🌿</span><span data-nivel>Nivel 1</span>
        </button>
        <button class="chip chip-racha" data-goto="stats">
          <span class="chip-ico">🔥</span><strong data-racha>0</strong> días
        </button>
        <button class="avatar-btn" data-open-perfil aria-label="Perfil">
          <span class="avatar" data-avatar>?</span>
        </button>
      </header>

      <div class="hero">
        <span class="pill">Hoy</span>
        <h1>Tu plan</h1>
        <p class="muted">Organiza tus sesiones y mantén un ritmo realista cada día.</p>
        <svg class="hero-decor" viewBox="0 0 200 120" aria-hidden="true">
          <rect x="60" y="30" width="80" height="70" rx="6" fill="var(--pri-soft)"/>
          <path d="M60,30 L100,10 L140,30" fill="var(--pri-light)" stroke="var(--pri-d)" stroke-width="2"/>
          <line x1="60" y1="55" x2="140" y2="55" stroke="var(--pri-d)" opacity=".3"/>
          <line x1="60" y1="75" x2="140" y2="75" stroke="var(--pri-d)" opacity=".3"/>
          <circle cx="100" cy="70" r="12" fill="var(--leaf-soft)"/>
          <path d="M100,60 Q108,70 100,80 Q92,70 100,60 Z" fill="var(--pri)" opacity=".9"/>
        </svg>
      </div>

      <nav class="week-strip" data-week></nav>

      <article class="card card-plan-hoy">
        <div class="card-head">
          <h2><span class="section-sun">🌱</span> Plan de hoy</h2>
          <span class="chip chip-soft" data-bloques>0 bloques</span>
        </div>
        <ul class="timeline" data-timeline></ul>
        <div class="progress progress-lg">
          <span class="progress-title">Completado hoy</span>
          <div class="progress-bar"><span data-plan-fill style="width:0%"></span></div>
          <span class="progress-label"><span data-plan-pct>0</span>%</span>
        </div>
      </article>

      <article class="card card-hito" data-goto="oposicion" role="button" tabindex="0">
        <div class="hito-ico">🎯</div>
        <div class="hito-txt">
          <span class="chip chip-soft">Próximo hito</span>
          <h3 data-hito-nombre>Examen</h3>
          <p class="muted" data-hito-desc>Consulta la fecha y los temas</p>
        </div>
        <span class="chevron" aria-hidden="true">›</span>
      </article>

      <div class="plan-actions">
        <button class="btn btn-primary btn-block" data-plan-editar>✏️ Editar mi disponibilidad</button>
        <button class="btn btn-outline btn-block" data-plan-reprog>⏱ Hoy tengo otro tiempo</button>
      </div>
    </section>
  </template>

  <!-- ─────────────────────── ESTADÍSTICAS ─────────────────────── -->
  <template id="tpl-stats">
    <section class="view view-stats">
      <header class="top-bar">
        <img class="brand-mini" src="/logo.svg" alt="Aprentix">
        <button class="chip chip-level" data-open-perfil>
          <span class="chip-ico">🌿</span><span data-nivel>Nivel 1</span>
        </button>
        <button class="chip chip-racha" data-goto="stats">
          <span class="chip-ico">🔥</span><strong data-racha>0</strong> días
        </button>
        <button class="avatar-btn" data-open-perfil aria-label="Perfil">
          <span class="avatar" data-avatar>?</span>
        </button>
      </header>

      <div class="hero">
        <h1>Estadísticas</h1>
        <p class="muted">Mide tu constancia y detecta dónde progresas mejor.</p>
      </div>

      <div class="stats-tiles">
        <div class="tile">
          <span class="tile-ico">🔥</span>
          <div><span class="muted">Racha</span><strong data-racha2>0 días</strong></div>
        </div>
        <div class="tile">
          <span class="tile-ico">⏱️</span>
          <div><span class="muted">Tiempo semana</span><strong data-minutos>0m</strong></div>
        </div>
        <div class="tile">
          <span class="tile-ico">🎯</span>
          <div><span class="muted">Precisión</span><strong data-precision>0%</strong></div>
        </div>
      </div>

      <article class="card">
        <div class="card-head">
          <h2>📊 Actividad semanal</h2>
          <span class="chip chip-outline">📅 7 días</span>
        </div>
        <div class="chart-bars" data-chart aria-label="Actividad semanal"></div>
      </article>

      <article class="card card-progreso">
        <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
          <circle class="ring-bg" cx="60" cy="60" r="52"/>
          <circle class="ring-fg" cx="60" cy="60" r="52" data-ring pathLength="100"/>
          <text x="60" y="66" text-anchor="middle" class="ring-txt" data-ring-txt>0%</text>
        </svg>
        <div class="progreso-txt">
          <h2>Progreso total</h2>
          <p><strong data-hechas>0</strong> de <strong data-totales>0</strong> unidades</p>
          <p class="muted" data-progreso-lema>¡Sigue así!</p>
        </div>
      </article>

      <article class="card">
        <h2>🌿 Rendimiento por materia</h2>
        <ul class="list list-materias" data-rendimiento></ul>
      </article>
    </section>
  </template>

  <!-- ─────────────────────── OPOSICIÓN (temas + unidades + examen) ─────────────────────── -->
  <template id="tpl-oposicion">
    <section class="view view-oposicion">
      <header class="top-bar">
        <img class="brand-mini" src="/logo.svg" alt="Aprentix">
        <button class="chip chip-level" data-open-perfil>
          <span class="chip-ico">🌿</span><span data-nivel>Nivel 1</span>
        </button>
        <button class="chip chip-racha" data-goto="stats">
          <span class="chip-ico">🔥</span><strong data-racha>0</strong> días
        </button>
        <button class="avatar-btn" data-open-perfil aria-label="Perfil">
          <span class="avatar" data-avatar>?</span>
        </button>
      </header>

      <div class="hero">
        <span class="pill">Mi oposición</span>
        <h1 data-opos-nombre>—</h1>
        <p class="muted" data-opos-organismo>—</p>
      </div>

      <article class="card card-examen">
        <div class="obj-ico" style="background:var(--pri-soft);color:var(--pri-d)">📅</div>
        <div class="obj-txt">
          <span class="chip chip-soft">Fecha del examen</span>
          <h2 data-opos-fecha>Sin confirmar</h2>
          <p class="muted small" data-opos-fecha-detalle></p>
        </div>
      </article>

      <article class="card">
        <div class="card-head">
          <h2>📚 Temas y unidades</h2>
          <span class="chip chip-soft" data-opos-count>0 temas</span>
        </div>
        <ul class="opos-temas" data-opos-temas></ul>
      </article>
    </section>
  </template>

  <!-- ─────────────────────── PERFIL ─────────────────────── -->
  <template id="tpl-perfil">
    <section class="view view-perfil">
      <div class="perfil-hero">
        <img class="brand-hero" src="/logo.svg" alt="">
        <h1 data-nombre>—</h1>
        <p class="muted" data-email>—</p>
        <span class="chip chip-outline"><span class="chip-ico">🌿</span> <span data-nivel>Nivel 1</span></span>
      </div>

      <div class="stats-tiles">
        <div class="tile">
          <span class="tile-ico">🔥</span>
          <div><span class="muted">Racha</span><strong data-racha>0 días</strong></div>
        </div>
        <div class="tile">
          <span class="tile-ico">⏱️</span>
          <div><span class="muted">XP</span><strong data-xp>0</strong></div>
        </div>
        <div class="tile">
          <span class="tile-ico">🎯</span>
          <div><span class="muted">Progreso</span><strong data-pct>0%</strong></div>
        </div>
      </div>

      <article class="card card-objetivo">
        <div class="obj-ico">🎯</div>
        <div class="obj-txt">
          <span class="chip chip-soft">Tu objetivo</span>
          <h2 data-obj-titulo>Elige tu oposición</h2>
          <p class="muted" data-obj-desc>Personaliza tu plan de estudio.</p>
          <div class="progress">
            <div class="progress-bar"><span data-obj-fill style="width:0%"></span></div>
            <span class="progress-label"><span data-obj-pct>0</span>%</span>
          </div>
        </div>
      </article>

      <article class="card">
        <h2>🎖️ Logros</h2>
        <ul class="logros-grid" data-logros></ul>
      </article>

      <article class="card">
        <h2>Preferencias</h2>
        <ul class="list list-plain">
          <li data-goto="oposicion">
            <span class="ico-round">📚</span>
            <div><strong>Mi oposición</strong><span class="muted" data-perf-opos>Ver temas y examen</span></div>
            <span class="chevron">›</span>
          </li>
          <li data-goto-wizard>
            <span class="ico-round">📅</span>
            <div><strong>Disponibilidad</strong><span class="muted" data-perf-disp>—</span></div>
            <span class="chevron">›</span>
          </li>
          <li>
            <span class="ico-round">🌓</span>
            <div><strong>Tema</strong><span class="muted" data-theme-label>Automático</span></div>
            <button class="btn btn-mini" data-toggle-theme>Cambiar</button>
          </li>
        </ul>
      </article>

      <article class="card" data-admin-card hidden>
        <h2>🛠️ Administración</h2>
        <ul class="list list-plain">
          <li data-goto="admin">
            <span class="ico-round">👥</span>
            <div><strong>Usuarios</strong><span class="muted">Gestionar cuentas y roles</span></div>
            <span class="chevron">›</span>
          </li>
          <li data-goto="administracion">
            <span class="ico-round">📚</span>
            <div><strong>Oposiciones</strong><span class="muted">Importar oposición desde JSON</span></div>
            <span class="chevron">›</span>
          </li>
        </ul>
      </article>

      <button class="btn btn-outline btn-block" data-logout>🚪 Cerrar sesión</button>
    </section>
  </template>

  <!-- ─────────────────────── UNIDAD (unificada) ─────────────────────── -->
  <template id="tpl-unidad">
    <section class="view view-unidad">
      <header class="unidad-head">
        <button class="btn btn-ghost btn-mini" data-back aria-label="Atrás">‹</button>
        <div class="unidad-titulo">
          <span class="muted small" data-unidad-tema>—</span>
          <h1 data-unidad-nombre>—</h1>
        </div>
        <span class="chip chip-soft"><span class="chip-ico">🕒</span> <span data-unidad-min>-- min</span></span>
      </header>

      <div class="unidad-progreso">
        <div class="progress">
          <div class="progress-bar"><span data-unidad-fill style="width:0%"></span></div>
          <span class="progress-label"><span data-unidad-min-actuales>0</span> / <span data-unidad-min-total>0</span> min</span>
        </div>
      </div>

      <article class="card card-teoria" data-panel="teoria">
        <div class="prose" data-teoria></div>
      </article>

      <article class="card card-test-cta" data-panel="test-cta">
        <div class="cta-ico">📝</div>
        <div>
          <h3>¿Hacemos un test rápido?</h3>
          <p class="muted"><span data-preguntas-n>10</span> preguntas para consolidar lo aprendido.</p>
        </div>
        <button class="btn btn-primary" data-test-start>Comenzar</button>
      </article>

      <article class="card card-test" data-panel="test" hidden>
        <div class="test-progress" data-test-progress></div>
        <div class="test-q" data-test-q></div>
        <div class="test-options" data-test-options></div>
        <div class="test-explicacion" data-test-explicacion hidden></div>
        <button class="btn btn-primary btn-block" data-test-siguiente hidden>Siguiente</button>
        <div class="test-resultado" data-test-resultado hidden></div>
      </article>
    </section>
  </template>

  <!-- ─────────────────────── ONBOARDING oposición ─────────────────────── -->
  <template id="tpl-onboarding">
    <section class="view view-onboarding">
      <header class="top-bar">
        <img class="brand-mini" src="/logo.svg" alt="Aprentix">
        <span class="chip chip-soft" data-user-lbl>—</span>
        <button class="btn-back" data-logout aria-label="Cerrar sesión">
          <span class="btn-back-ico">⏻</span> Salir
        </button>
      </header>

      <div class="hero">
        <h1>Elige tu oposición</h1>
        <p class="muted">Podrás cambiarla más tarde desde tu perfil.</p>
      </div>
      <ul class="onboarding-list" data-onboarding></ul>
      <button class="btn btn-outline btn-block" data-ir-administracion hidden style="margin-top:var(--sp-2)">
        📚 Importar oposición (admin)
      </button>
      <div class="onboarding-cta">
        <button class="btn btn-primary btn-block" data-onboarding-guardar disabled>
          Continuar
        </button>
      </div>
    </section>
  </template>

  <!-- ─────────────────────── WIZARD DISPONIBILIDAD ─────────────────────── -->
  <template id="tpl-wizard">
    <section class="view view-wizard">
      <header class="wizard-head">
        <img class="brand-mini" src="/logo.svg" alt="Aprentix">
        <div class="wizard-steps">
          <span class="dot active" data-step="1"></span>
          <span class="dot" data-step="2"></span>
          <span class="dot" data-step="3"></span>
        </div>
        <button class="btn-back" data-wizard-back aria-label="Atrás">
          <span class="btn-back-ico">‹</span> Atrás
        </button>
      </header>

      <!-- Botón "Salir" siempre visible para que el usuario no se sienta
           atrapado si algo va mal.  El botón "Atrás" mueve entre pasos
           del wizard, éste cierra sesión directamente. -->
      <div class="wizard-escape">
        <button class="btn btn-ghost btn-mini" data-wizard-logout>
          ⏻ Cerrar sesión
        </button>
      </div>

      <!-- Paso 1: modo -->
      <div class="wizard-step" data-wstep="1">
        <div class="hero">
          <h1>¿Cómo quieres organizarte?</h1>
          <p class="muted">Puedes indicar un total semanal o afinar día por día.</p>
        </div>
        <ul class="option-grid">
          <li>
            <label>
              <input type="radio" name="modo" value="semanal">
              <div class="option-card">
                <span class="option-ico">📆</span>
                <h3>Horas semanales</h3>
                <p>Total de horas a la semana. Nosotros repartimos entre los días.</p>
              </div>
            </label>
          </li>
          <li>
            <label>
              <input type="radio" name="modo" value="diario" checked>
              <div class="option-card">
                <span class="option-ico">🗓️</span>
                <h3>Detalle por día</h3>
                <p>Indicas cuánto puedes cada día: más el fin de semana, menos entre semana.</p>
              </div>
            </label>
          </li>
        </ul>
        <div class="sticky-cta">
          <button class="btn btn-primary btn-block" data-wizard-next="2">Continuar</button>
        </div>
      </div>

      <!-- Paso 2: horas -->
      <div class="wizard-step" data-wstep="2" hidden>
        <div class="hero">
          <h1>Tu disponibilidad</h1>
          <p class="muted" data-wizard-hint>Ajusta las horas para cada día.</p>
        </div>

        <div data-wizard-semanal hidden>
          <label class="range-label">
            <span>Horas a la semana</span>
            <strong><span data-hs-val>10</span> h</strong>
          </label>
          <input type="range" min="1" max="50" value="10" data-hs step="1" class="range">
          <div class="range-scale"><span>1</span><span>25</span><span>50</span></div>
        </div>

        <div data-wizard-diario>
          <ul class="days-grid" data-days>
            <li><span class="day-lbl">Lun</span>
              <input type="number" min="0" max="12" step="0.5" value="2" data-day="lun" inputmode="decimal">
              <span class="day-unit">h</span></li>
            <li><span class="day-lbl">Mar</span>
              <input type="number" min="0" max="12" step="0.5" value="2" data-day="mar" inputmode="decimal">
              <span class="day-unit">h</span></li>
            <li><span class="day-lbl">Mié</span>
              <input type="number" min="0" max="12" step="0.5" value="2" data-day="mie" inputmode="decimal">
              <span class="day-unit">h</span></li>
            <li><span class="day-lbl">Jue</span>
              <input type="number" min="0" max="12" step="0.5" value="3" data-day="jue" inputmode="decimal">
              <span class="day-unit">h</span></li>
            <li><span class="day-lbl">Vie</span>
              <input type="number" min="0" max="12" step="0.5" value="2" data-day="vie" inputmode="decimal">
              <span class="day-unit">h</span></li>
            <li><span class="day-lbl">Sáb</span>
              <input type="number" min="0" max="12" step="0.5" value="3" data-day="sab" inputmode="decimal">
              <span class="day-unit">h</span></li>
            <li><span class="day-lbl">Dom</span>
              <input type="number" min="0" max="12" step="0.5" value="0" data-day="dom" inputmode="decimal">
              <span class="day-unit">h</span></li>
          </ul>
          <p class="muted small">Total: <strong data-hd-total>14</strong> h/semana</p>
        </div>

        <div class="sticky-cta">
          <button class="btn btn-primary btn-block" data-wizard-next="3">Continuar</button>
        </div>
      </div>

      <!-- Paso 3: método de estudio -->
      <div class="wizard-step" data-wstep="3" hidden>
        <div class="hero">
          <h1>Últimos detalles</h1>
          <p class="muted">Cómo prefieres estudiar.</p>
        </div>

        <div class="field">
          <span class="field-lbl">Duración de sesiones</span>
          <div class="segmented" role="radiogroup" data-metodo>
            <button type="button" data-val="cortas" class="active">Cortas (25 min)</button>
            <button type="button" data-val="profundas">Profundas (45 min)</button>
          </div>
        </div>

        <div class="field">
          <span class="field-lbl">Ritmo</span>
          <div class="segmented" role="radiogroup" data-ritmo>
            <button type="button" data-val="relajado">Relajado</button>
            <button type="button" data-val="normal" class="active">Normal</button>
            <button type="button" data-val="intensivo">Intensivo</button>
          </div>
        </div>

        <div class="sticky-cta">
          <button class="btn btn-primary btn-block" data-wizard-finish>Crear mi plan</button>
        </div>
      </div>
    </section>
  </template>

  <!-- ─────────────────────── ADMIN ─────────────────────── -->
  <template id="tpl-admin">
    <section class="view view-admin">
      <header class="top-bar">
        <button class="btn btn-ghost btn-mini" data-back>‹</button>
        <h1 class="admin-title">Administración</h1>
        <span></span>
      </header>

      <div class="stats-tiles stats-4">
        <div class="tile"><span class="tile-ico">👤</span><div><span class="muted">Usuarios</span><strong data-ad-usr>0</strong></div></div>
        <div class="tile"><span class="tile-ico">📚</span><div><span class="muted">Oposiciones</span><strong data-ad-opos>0</strong></div></div>
        <div class="tile"><span class="tile-ico">✉️</span><div><span class="muted">Cola email</span><strong data-ad-mail>0</strong></div></div>
        <div class="tile"><span class="tile-ico">🔔</span><div><span class="muted">Cola push</span><strong data-ad-push>0</strong></div></div>
      </div>

      <article class="card">
        <div class="card-head">
          <h2>Usuarios</h2>
          <input class="input input-mini" type="search" placeholder="Buscar" data-ad-buscar>
        </div>
        <ul class="admin-users" data-ad-users></ul>
      </article>

      <article class="card">
        <h2>Oposiciones — fecha de examen</h2>
        <p class="muted small">Ajusta la fecha del examen. Marca "orientativa" si sólo sabes el mes/año.</p>
        <ul class="admin-opos" data-ad-opos-lista></ul>
      </article>
    </section>
  </template>

  <!-- ─────────────────────── MODO ESTUDIO (fullscreen) ─────────────────────── -->
  <template id="tpl-estudiar-modal">
    <div class="modal-backdrop" data-modal>
      <div class="modal">
        <button class="modal-close" data-modal-close aria-label="Cerrar">×</button>
        <h2>¿Cuánto tiempo tienes ahora?</h2>
        <p class="muted small">Prepararemos una sesión adaptada a tus minutos.</p>
        <div class="tiempo-picker">
          <label>Horas
            <input type="number" min="0" max="6" value="0" data-h inputmode="numeric">
          </label>
          <label>Min
            <input type="number" min="0" max="55" step="5" value="45" data-m inputmode="numeric">
          </label>
        </div>
        <div class="tiempo-chips">
          <button type="button" data-quick="25">25 min</button>
          <button type="button" data-quick="45">45 min</button>
          <button type="button" data-quick="60">1 h</button>
          <button type="button" data-quick="90">1 h 30</button>
          <button type="button" data-quick="120">2 h</button>
        </div>
        <div class="field" style="margin-top:var(--sp-2)">
          <span class="field-lbl">Sistema de estudio</span>
          <select class="input" data-sistema></select>
        </div>
        <button class="btn btn-primary btn-block" data-empezar-estudio style="margin-top:var(--sp-3)">
          Empezar ahora
        </button>
      </div>
    </div>
  </template>

  <template id="tpl-estudio">
    <section class="view view-estudio">
      <header class="estudio-head">
        <button class="btn btn-ghost btn-mini" data-estudio-salir aria-label="Salir">×</button>
        <div class="estudio-meta">
          <span class="muted small" data-estudio-idx>Bloque 1/1</span>
          <strong data-estudio-tipo>Estudio</strong>
        </div>
        <span></span>
      </header>

      <div class="cronometro" data-crono>
        <svg viewBox="0 0 200 200" class="crono-ring">
          <circle cx="100" cy="100" r="86" class="crono-bg"/>
          <circle cx="100" cy="100" r="86" class="crono-fg" data-crono-ring
                  pathLength="100" transform="rotate(-90 100 100)"/>
        </svg>
        <div class="crono-txt">
          <strong data-crono-mmss>00:00</strong>
          <span class="muted small" data-crono-total>de 25 min</span>
        </div>
      </div>

      <div class="estudio-cuerpo" data-estudio-cuerpo>
        <!-- Se rellena dinámicamente según el tipo de bloque -->
      </div>

      <div class="estudio-cta">
        <button class="btn btn-outline btn-block" data-estudio-saltar hidden>
          ⏭ Saltar descanso
        </button>
        <button class="btn btn-primary btn-block" data-estudio-siguiente>
          Siguiente
        </button>
      </div>
    </section>
  </template>

  <!-- ─────────────────────── RESET PASSWORD ─────────────────────── -->
  <template id="tpl-reset">
    <section class="auth-view">
      <img class="brand-hero" src="/logo.svg" alt="Aprentix">
      <div class="auth-card" data-panel>
        <h2 style="color:var(--pri-d);margin-top:0">Nueva contraseña</h2>
        <p class="muted small">Elige una contraseña nueva. Se te iniciará sesión con ella.</p>
        <form data-form-reset autocomplete="off">
          <label>
            <span>Contraseña</span>
            <input name="password" type="password" autocomplete="new-password" minlength="8" required>
          </label>
          <div class="pw-strength" data-pw-strength>
            <div class="pw-strength-bar"><span data-pw-fill></span></div>
            <span class="pw-strength-label" data-pw-label>Introduce una contraseña</span>
          </div>
          <label>
            <span>Repite la contraseña</span>
            <input name="password2" type="password" autocomplete="new-password" minlength="8" required>
          </label>
          <p class="mini-hint" data-pw-match hidden></p>
          <button class="btn btn-primary btn-block" type="submit" style="margin-top:var(--sp-2)">Guardar</button>
          <p class="auth-err" data-err hidden></p>
        </form>
      </div>
    </section>
  </template>

  <!-- ─────────────────────── SEMANA (aceptar/modificar) ─────────────────────── -->
  <template id="tpl-semana">
    <div class="modal-backdrop" data-modal>
      <div class="modal">
        <button class="modal-close" data-modal-close aria-label="Cerrar">×</button>
        <h2>Nueva semana</h2>
        <p class="muted small">Ésta es la disponibilidad que hemos detectado. Puedes ajustarla.</p>
        <ul class="days-grid" data-semana-days></ul>
        <p class="muted small" style="margin-top:6px">Total: <strong data-semana-total>—</strong> h</p>
        <button class="btn btn-primary btn-block" data-semana-aceptar style="margin-top:var(--sp-3)">
          Aceptar y planificar
        </button>
      </div>
    </div>
  </template>

  <!-- ─────────────────────── EDITOR DE OPOSICIÓN (temas > unidades > preguntas) ─────────────────────── -->
  <template id="tpl-editar">
    <section class="view view-editar">
      <header class="top-bar">
        <button class="btn btn-ghost btn-mini" data-back>‹</button>
        <h1 class="admin-title" data-op-nombre>Editor</h1>
        <span></span>
      </header>

      <!-- Migas de pan (Oposición > Tema > Unidad) -->
      <nav class="crumbs" data-crumbs></nav>

      <div class="editor-panel" data-panel-temas>
        <div class="card-head">
          <h2>Temas</h2>
          <button class="btn btn-mini btn-primary" data-nuevo-tema>+ Tema</button>
        </div>
        <ul class="editor-list" data-lista-temas></ul>
      </div>

      <div class="editor-panel" data-panel-unidades hidden>
        <div class="card-head">
          <h2 data-tema-titulo>Unidades</h2>
          <button class="btn btn-mini btn-primary" data-nueva-unidad>+ Unidad</button>
        </div>
        <ul class="editor-list" data-lista-unidades></ul>
      </div>

      <div class="editor-panel" data-panel-unidad hidden>
        <div class="card-head">
          <h2 data-unidad-titulo-edit>Editar unidad</h2>
          <button class="btn btn-mini" data-guardar-unidad>Guardar</button>
        </div>
        <form data-form-unidad>
          <div class="field-row">
            <label class="field"><span class="field-lbl">Nombre</span>
              <input class="input" name="nombre" required></label>
            <label class="field"><span class="field-lbl">Slug</span>
              <input class="input" name="slug" required></label>
          </div>
          <div class="field-row">
            <label class="field"><span class="field-lbl">Orden</span>
              <input class="input" name="orden" type="number" min="1" value="1"></label>
            <label class="field"><span class="field-lbl">Min estimado</span>
              <input class="input" name="minutos_est" type="number" min="1" value="20"></label>
          </div>
          <label class="field"><span class="field-lbl">Resumen (opcional)</span>
            <input class="input" name="resumen"></label>
          <label class="field"><span class="field-lbl">Teoría (Markdown)</span>
            <textarea class="input" name="teoria_md" rows="10" spellcheck="false"
                       style="font-family:ui-monospace,Menlo,Consolas,monospace;font-size:var(--fs-sm)"></textarea>
          </label>
        </form>

        <div class="card-head" style="margin-top:var(--sp-3)">
          <h2>Preguntas</h2>
          <button class="btn btn-mini btn-primary" data-nueva-pregunta>+ Pregunta</button>
        </div>
        <ul class="editor-list" data-lista-preguntas></ul>
      </div>

      <div class="editor-panel" data-panel-pregunta hidden>
        <div class="card-head">
          <h2 data-preg-titulo>Editar pregunta</h2>
          <button class="btn btn-mini" data-guardar-pregunta>Guardar</button>
        </div>
        <form data-form-pregunta>
          <label class="field"><span class="field-lbl">Enunciado</span>
            <textarea class="input" name="enunciado" rows="3" required></textarea></label>
          <label class="field"><span class="field-lbl">Explicación (opcional)</span>
            <textarea class="input" name="explicacion" rows="2"></textarea></label>
          <div class="field-row">
            <label class="field"><span class="field-lbl">Dificultad (1-5)</span>
              <input class="input" name="dificultad" type="number" min="1" max="5" value="2"></label>
          </div>
          <div class="field">
            <span class="field-lbl">Opciones (marca la correcta)</span>
            <ul class="opciones-lista" data-opciones></ul>
            <button class="btn btn-mini btn-outline" type="button" data-add-opcion>+ Añadir opción</button>
          </div>
        </form>
      </div>
    </section>
  </template>

  <!-- ─────────────────────── MODAL: añadir tema ─────────────────────── -->
  <template id="tpl-modal-tema">
    <div class="modal-backdrop" data-modal>
      <div class="modal">
        <button class="modal-close" data-modal-close aria-label="Cerrar">×</button>
        <h2>Nuevo tema</h2>
        <p class="muted small">Si el slug ya existe, se enlazará el tema existente.</p>
        <form data-form>
          <label class="field"><span class="field-lbl">Nombre</span>
            <input class="input" name="nombre" required></label>
          <label class="field"><span class="field-lbl">Slug</span>
            <input class="input" name="slug" required
                   pattern="[a-z0-9-]+" title="minúsculas, números y guiones"></label>
          <label class="field"><span class="field-lbl">Icono (emoji)</span>
            <input class="input" name="icono" value="📘" maxlength="4"></label>
          <button class="btn btn-primary btn-block" type="submit">Añadir</button>
        </form>
      </div>
    </div>
  </template>

  <!-- ─────────────────────── ADMINISTRACIÓN (importar oposiciones) ─────────────────────── -->
  <template id="tpl-administracion">
    <section class="view view-administracion">
      <header class="top-bar">
        <button class="btn btn-ghost btn-mini" data-volver-administracion>‹</button>
        <h1 class="admin-title">Administrar oposiciones</h1>
        <span></span>
      </header>

      <article class="card">
        <h2>Importar una oposición</h2>
        <p class="muted small">
          Pega el JSON de la oposición. Debe contener al menos <code>slug</code> y
          <code>nombre</code>; puede incluir sus <code>temas</code>, unidades y preguntas.
          Si el slug ya existe se reutiliza (no se duplican unidades ni preguntas).
        </p>
        <form data-form-importar>
          <label class="field">
            <span class="field-lbl">Contenido JSON</span>
            <textarea data-json-oposicion rows="16" required spellcheck="false"
                      class="input"
                      style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:var(--fs-sm);resize:vertical;min-height:280px"
                      placeholder='{"slug":"auxiliar-administrativo", "nombre":"Auxiliar Administrativo", "temas":[]}'></textarea>
          </label>
          <p class="auth-err" data-error-importacion hidden></p>
          <button class="btn btn-primary btn-block" type="submit" style="margin-top:var(--sp-2)">Importar oposición</button>
        </form>
      </article>
    </section>
  </template>

  <!-- ─────────────────────── VERIFY ─────────────────────── -->
  <template id="tpl-verify">
    <section class="auth-view">
      <img class="brand-hero" src="/logo.svg" alt="Aprentix">
      <div class="auth-card" style="text-align:center" data-panel>
        <h2 style="color:var(--pri-d);margin-top:0">Confirmando tu cuenta…</h2>
        <p class="muted">Espera un momento.</p>
      </div>
    </section>
  </template>

  <!-- ─────────────────────── BOTTOM NAV ─────────────────────── -->
  <template id="tpl-nav">
    <nav class="bottom-nav" aria-label="Navegación principal">
      <button data-nav="home" class="active" aria-label="Inicio">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg>
        <span>Inicio</span>
      </button>
      <button data-nav="plan" aria-label="Plan">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/></svg>
        <span>Plan</span>
      </button>
      <button data-nav="stats" aria-label="Estadísticas">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <rect x="3"  y="13" width="4.5" height="8"  rx="1.2"/>
          <rect x="9.75" y="8" width="4.5" height="13" rx="1.2"/>
          <rect x="16.5" y="4" width="4.5" height="17" rx="1.2"/>
        </svg>
        <span>Estadísticas</span>
      </button>
      <button data-nav="perfil" aria-label="Perfil">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/></svg>
        <span>Perfil</span>
      </button>
    </nav>
  </template>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="app.js"></script>
</body>
</html>
