<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Aprentix</title>

  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="application-name" content="Aprentix">
  <meta name="theme-color" content="#6B8E23" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101E1A" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Aprentix">
  <link rel="apple-touch-icon" href="/shared/pwa-icons/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="/shared/pwa-icons/icon-any.svg">

  <link rel="stylesheet" href="/shared/tokens.css">
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="/shared/components.css">
  <link rel="stylesheet" href="/shared/header.css">
  <link rel="stylesheet" href="/shared/auth.css">
  <link rel="stylesheet" href="/estudio/style.css">

  <script>
    // Tema oscuro antes del primer render. Reconoce "system" (respetar el
    // ajuste del OS) además de light/dark, para que el selector de la vista
    // "Mi cuenta" pueda pintar cualquiera de los tres estados sin fugas.
    (function () {
      var m = document.cookie.match(/(?:^|;\s*)aprentix_theme=(dark|light|system)/);
      var pref = m ? m[1] : 'system';
      var theme = (pref === 'system')
        ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        : pref;
      if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    })();
  </script>

  <script>
    // Registro del service worker en la raíz (scope "/"), para que la PWA
    // pueda cachear el shell y funcionar offline. Aprovechamos el load para
    // no bloquear la primera pintura.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker
          .register("/service-worker.js", { scope: "/" })
          .then(function (reg) {
            if (reg.waiting) reg.waiting.postMessage("SKIP_WAITING");
            reg.addEventListener("updatefound", function () {
              var nw = reg.installing;
              if (!nw) return;
              nw.addEventListener("statechange", function () {
                if (nw.state === "installed" && navigator.serviceWorker.controller) {
                  nw.postMessage("SKIP_WAITING");
                }
              });
            });
          })
          .catch(function () { /* silent */ });
      });
    }
  </script>

  <!-- Sesión + auth. Deben cargarse ANTES de app.js (no defer). -->
  <script src="/shared/auth/session.js"></script>

  <!-- Componentes web reusables (login/registro con estética solarpunk). -->
  <script src="/shared/components/ap-auth-form.js" defer></script>

  <!-- Cabecera reescrita: <xp-ring>, <streak-flame>, sin brand/tabs. -->
  <script src="/shared/header.js" defer></script>

  <!-- Markdown para renderizar teoría. -->
  <script src="/shared/vendor/marked.min.js" defer></script>
  <script src="/shared/vendor/purify.min.js" defer></script>

  <!-- app.js con defer garantiza que se ejecute DESPUÉS de que
       <ap-auth-form> y <aprentix-header> hayan sido definidos por sus
       scripts diferidos correspondientes; un script sync al final del body
       correría antes y crearía elementos "unknown" sin métodos. -->
  <script src="/estudio/app.js" defer></script>
</head>
<body>
  <!-- La cabecera vive dentro del contenedor #app-header para poder ocultarla
       durante el login/verify/reset. Sin sesión no queremos mostrar XP ni
       avatar; sólo la tarjeta de login. -->
  <div id="app-header">
    <aprentix-header active="estudio"
      nav-items='[
        {"id":"home","label":"Inicio","icon":"home","view":"home"},
        {"id":"plan","label":"Plan","icon":"calendar","view":"plan"},
        {"id":"estadisticas","label":"Estadísticas","icon":"chart","view":"estadisticas"},
        {"id":"perfil","label":"Perfil","icon":"user","view":"perfil"}
      ]'></aprentix-header>
  </div>

  <main id="root">
    <!-- El router hash mete aquí la vista activa. -->
    <div class="loading">Cargando…</div>
  </main>

  <!-- Pila de tarjetas de notificación de logros/retos.  Se rellena
       dinámicamente desde app.js cuando un intento desbloquea algo. -->
  <div id="logros-notif-stack" class="logros-notif-stack" aria-live="polite"></div>

  <div id="toast" class="toast hidden"></div>
</body>
</html>
