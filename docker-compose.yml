# Compose maestro SOLO para desarrollo local.
#
# En producción (Dokploy) NO se usa: cada carpeta bajo deploy/ es una
# Compose Application independiente que se puede redesplegar por
# separado. Aquí incluimos los composes que interesen para poder
# levantar todo el stack de una tacada.
#
# Modo único (unificado). Un solo contenedor con Caddy + uvicorn sirve la
# SPA rediseñada /estudio/ y la API de contenidos, todo desde web/. Se
# despliega desde deploy/app/. Es más simple: menos partes móviles y un
# solo redeploy tras cualquier cambio de frontend.
#
# El modo segmentado (un stack por SPA) y las SPAs legacy landing/tests/
# teoría se retiraron al unificar el frontend bajo /estudio/.
#
# Requiere Docker Compose 2.20 o superior (por `include:`).

include:
  - deploy/core/docker-compose.yml
  - deploy/pgadmin/docker-compose.yml
  - deploy/app/docker-compose.yml
  - deploy/notificador/docker-compose.yml
  - deploy/backups/docker-compose.yml
