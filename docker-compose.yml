# =============================================================================
# Compose maestro SOLO para desarrollo local.
#
# En producción y en desa cada carpeta bajo deploy/ se despliega como
# una Compose Application independiente en Dokploy, con SU PROPIO
# .env — así puedes redesplegar sólo `deploy/app` cuando cambia el
# frontend sin tocar la BBDD ni los workers.
#
# En local basta con:
#   cp .env.example .env  &&  $EDITOR .env  &&  docker compose up -d
# para levantar todo el stack de una tacada (`include:` fusiona los
# cuatro composes en un único proyecto).
#
# Requiere Docker Compose 2.20 o superior (por `include:`).
# =============================================================================

include:
  - deploy/core/docker-compose.yml
  - deploy/app/docker-compose.yml
  - deploy/mailer/docker-compose.yml
  - deploy/notificador/docker-compose.yml
