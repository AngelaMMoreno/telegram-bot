# ─────────────────────────────────────────────────────────────────────────────
# Stack PILDORAS — bot de Discord que publica píldoras del temario.
#
# Es autónomo: no depende del stack core ni de ningún Postgres. Guarda las
# píldoras en un SQLite propio bajo /mnt/data/pildoras, que sobrevive a los
# redespliegues igual que /mnt/data/ficheros.
#
# Dos piezas con la misma imagen:
#
#   bot      Proceso residente. Publica la píldora diaria y atiende
#            /consejo, /revisar y /pildoras. NO monta los PDFs: no tiene
#            forma de leerlos.
#
#   ingesta  Trabajo puntual (profile 'manual', no arranca con 'up'). Lee
#            /mnt/data/ficheros en SOLO LECTURA, extrae fragmentos y genera
#            las píldoras con la Batch API de Claude. Se lanza a mano:
#
#              docker compose -f deploy/pildoras/docker-compose.yml \
#                  run --rm ingesta
#
# Sin labels de Traefik y sin dokploy-network a propósito: no recibe tráfico
# HTTP ni habla con ningún otro contenedor, solo abre conexiones salientes
# hacia Discord y la API de Claude.
#
# Antes del primer despliegue, en el host:
#     sudo mkdir -p /mnt/data/pildoras
# ─────────────────────────────────────────────────────────────────────────────

services:

  bot:
    build: ../../pildoras
    environment:
      DISCORD_TOKEN:     ${DISCORD_TOKEN:?DISCORD_TOKEN requerido}
      DISCORD_CANAL_ID:  ${DISCORD_CANAL_ID:?DISCORD_CANAL_ID requerido}
      DISCORD_GUILD_ID:  ${DISCORD_GUILD_ID:-}
      RUTA_DB:           /datos/pildoras.db
      HORA_PILDORA:      ${HORA_PILDORA:-9}
      MINUTO_PILDORA:    ${MINUTO_PILDORA:-0}
      LOG_LEVEL:         ${LOG_LEVEL:-INFO}
    volumes:
      - /mnt/data/pildoras:/datos
    restart: unless-stopped

  ingesta:
    build: ../../pildoras
    profiles: [manual]
    command: ["python", "-u", "ingesta.py"]
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY requerida}
      RUTA_DB:           /datos/pildoras.db
      BASE_DIR:          /ficheros
      MIN_CHARS:         ${MIN_CHARS:-400}
      LIMITE:            ${LIMITE:-0}
      LOG_LEVEL:         ${LOG_LEVEL:-INFO}
    volumes:
      # El mismo SQLite que lee el bot.
      - /mnt/data/pildoras:/datos
      # Los mismos PDFs que sirve el stack app, en solo lectura.
      - /mnt/data/ficheros:/ficheros:ro
