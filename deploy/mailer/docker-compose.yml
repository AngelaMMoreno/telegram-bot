# =============================================================================
# Stack MAILER ─ worker SMTP.
#
# Consume `cola_emails` de la BBDD del stack core del mismo entorno.
# Se une a la red PRIVADA del stack (`db-net-${DB_ALIAS:-prod}`) para
# hablar con `db` o `db-desa` — la red pública `dokploy-network` NO
# ve la BBDD (ver comentario en deploy/core/docker-compose.yml).
#
# Prerrequisito: la red `db-net-<alias>` debe existir (la crea el
# core al arrancar).  Si por lo que sea despliegas primero el mailer,
# créala a mano:  `docker network create db-net-desa`.
# =============================================================================

services:

  mailer:
    build:
      context: ../../mailer
      dockerfile: Dockerfile
    container_name: mailer${DB_ALIAS:+-${DB_ALIAS}}
    environment:
      DATABASE_URL:        postgres://${POSTGRES_USER:-aprentix}@db${DB_ALIAS:+-${DB_ALIAS}}:5432/${POSTGRES_DB}
      PGPASSWORD:          ${DB_PASS}
      MAILER_DEV_LOG_ONLY: ${MAILER_DEV_LOG_ONLY:-0}
      SMTP_HOST:           ${SMTP_HOST}
      SMTP_PORT:           ${SMTP_PORT:-587}
      SMTP_USER:           ${SMTP_USER:-}
      SMTP_PASS:           ${SMTP_PASS:-}
      SMTP_FROM:           ${SMTP_FROM:-No Contestar <no-reply@aprentix.es>}
      SMTP_TLS:            ${SMTP_TLS:-starttls}
      TICK_SECONDS:        ${TICK_SECONDS:-30}
      BATCH_LIMIT:         ${BATCH_LIMIT:-25}
      LOG_LEVEL:           ${LOG_LEVEL:-INFO}
    restart: unless-stopped
    networks:
      # Se une SOLO a la red privada de la BBDD.  No necesita
      # dokploy-network: no expone HTTP, sólo lee/escribe en Postgres.
      db-net:

networks:
  db-net:
    external: true
    name: db-net-${DB_ALIAS:-prod}
