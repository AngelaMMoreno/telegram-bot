# =============================================================================
# Stack MAILER ─ worker SMTP.
#
# Consume `cola_emails` de la BBDD.  Alcanza al `db` del stack CORE
# del MISMO entorno vía el alias `db${STACK_SUFFIX}` en dokploy-network.
# =============================================================================

services:

  mailer:
    build:
      context: ../../mailer
      dockerfile: Dockerfile
    container_name: mailer${STACK_SUFFIX}
    environment:
      DATABASE_URL: postgres://aprentix@db${STACK_SUFFIX}:5432/${DB_NAME}
      PGPASSWORD:   ${DB_PASS}
      SMTP_HOST:    ${SMTP_HOST}
      SMTP_PORT:    ${SMTP_PORT:-587}
      SMTP_USER:    ${SMTP_USER:-}
      SMTP_PASS:    ${SMTP_PASS:-}
      SMTP_FROM:    ${SMTP_FROM:-No Contestar <no-reply@aprentix.es>}
      SMTP_TLS:     ${SMTP_TLS:-starttls}
      TICK_SECONDS: ${MAILER_TICK:-30}
      BATCH:        ${MAILER_BATCH:-25}
      LOG_LEVEL:    ${MAILER_LOG:-INFO}
    restart: unless-stopped
    networks:
      dokploy-network:
        aliases:
          - mailer${STACK_SUFFIX}

networks:
  dokploy-network:
    external: true
