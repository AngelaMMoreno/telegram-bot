# ─────────────────────────────────────────────────────────────────────────────
# Stack CORE — el estado y la API.
#
# Servicios: db (Postgres+pgvector), postgrest, mailer.
# pgAdmin vive en su propio stack (deploy/pgadmin/) para no duplicarse
# cuando se despliegan varios `core` en paralelo (prod + desa).
# (El worker de embeddings está desactivado — ver bloque comentado abajo.)
# Redespliega esto cuando cambien:
#   - db/init/01_esquema.sql       (esquema, funciones, RLS, seed)
#   - la versión de PostgREST
#   - el mailer
#   - el servers.json de pgAdmin
#
# Los demás stacks (app/notificador) se conectan a estos servicios por
# nombre en la red externa dokploy-network. Levanta este stack primero.
# ─────────────────────────────────────────────────────────────────────────────

services:

  db:
    image: pgvector/pgvector:pg16
    environment:
      # Nombre de la BD: default 'aprentix' (producción). En la rama de
      # rediseño se sobrescribe con POSTGRES_DB=aprentix_desa en el .env
      # del stack para no chocar con producción cuando ambos convivan.
      POSTGRES_DB: ${POSTGRES_DB:-aprentix}
      POSTGRES_USER: ${POSTGRES_USER:-aprentix}
      POSTGRES_PASSWORD: ${DB_PASS:?DB_PASS requerida}
    command:
      - postgres
      - -c
      - app.jwt_secret=${JWT_SECRET:?JWT_SECRET requerida}
      - -c
      - app.admin_pass=${ADMIN_PASS:?ADMIN_PASS requerida}
      - -c
      - app.auth_pass=${AUTH_PASS:?AUTH_PASS requerida}
    volumes:
      - /mnt/data/pg:/var/lib/postgresql/data
      - ../../db/init:/docker-entrypoint-initdb.d:ro
      - ../../db/backups:/backups
    restart: unless-stopped
    # Alias de red por rama para que un único pgAdmin (stack `pgadmin`,
    # desplegado aparte) pueda distinguir las dos Postgres al haber
    # varios stacks `core` conviviendo en `dokploy-network`. Prod usa
    # `db-prod`, desa `db-desa`; sin definir, cae a `db` (dev local).
    # Los servicios del propio stack siguen accediendo por `db:5432`
    # porque Compose añade el nombre de servicio como alias automático.
    networks:
      dokploy-network:
        aliases:
          - ${DB_ALIAS:-db}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aprentix -d aprentix"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgrest:
    image: postgrest/postgrest:v12.2.3
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://autenticador@db:5432/${POSTGRES_DB:-aprentix}
      PGPASSWORD: ${AUTH_PASS:?AUTH_PASS requerida}
      PGRST_DB_ANON_ROLE: web_anon
      PGRST_DB_SCHEMAS: public
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_OPENAPI_SERVER_PROXY_URI: https://${DOMINIO_API:-api.aprentix.es}
    restart: unless-stopped
    networks: [dokploy-network]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`${DOMINIO_API:-api.aprentix.es}`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls=true"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.services.api.loadbalancer.server.port=3000"
      # Rate limit global (Traefik middleware in-memory, sin persistir IPs).
      # Protege login/refresh/registro sin necesidad de tabla histórica de
      # intentos: el contador vive en memoria del proxy y se pierde en el
      # reinicio. Suficiente para bloquear brute-force. El propio backend
      # además bloquea la cuenta a los 5 fallos (usuarios.bloqueado_hasta).
      - "traefik.http.middlewares.api-rl.ratelimit.average=100"
      - "traefik.http.middlewares.api-rl.ratelimit.burst=50"
      - "traefik.http.middlewares.api-rl.ratelimit.period=1m"
      - "traefik.http.routers.api.middlewares=api-rl"

  # Worker de embeddings — DESACTIVADO.
  #
  # Tras el rediseño del esquema (commit 7cb0e26) el auto-tagger y el
  # catálogo de etiquetas desaparecieron, así que los vectores de
  # `preguntas.embedding` ya no alimentan ninguna funcionalidad viva y el
  # worker sólo consumía CPU/RAM (modelo sentence-transformers) sin
  # aportar nada. Se comenta hasta que le demos un nuevo uso.
  #
  # Posible reactivación futura: deduplicación semántica de preguntas
  # muy parecidas dentro de una misma sección. El script
  # `embeddings/detectar_duplicados.py` ya existe y usa similitud coseno
  # > 0.90 para poblar `propuestas_fusion`, que un admin revisa y
  # fusiona/descarta. Si se retoma, hará falta:
  #   1. Descomentar este servicio y redeployar el stack core.
  #   2. Aplicar el barrido inicial: `UPDATE preguntas SET embedding=NULL`
  #      y encolar todas en `cola_embeddings` para revectorizar.
  #   3. Programar `detectar_duplicados.py` (cron o servicio residente).
  #
  # embeddings:
  #   build: ../../embeddings
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   environment:
  #     DATABASE_URL: postgres://${POSTGRES_USER:-aprentix}@db:5432/${POSTGRES_DB:-aprentix}
  #     PGPASSWORD: ${DB_PASS}
  #     EMB_LOTE: "32"
  #   volumes:
  #     - /mnt/data/embeddings_cache:/cache
  #   restart: unless-stopped
  #   networks: [dokploy-network]

  # Servicio de emails transaccionales (verificación de email, reset de
  # contraseña). Escucha `LISTEN email_enviar` sobre Postgres y envía por
  # SMTP genérico configurable con SMTP_HOST/PORT/USER/PASS/FROM/TLS.
  # En arranque sin SMTP puedes fijar DEV_LOG_ONLY=1: los correos se
  # imprimen en los logs en lugar de enviarse.
  mailer:
    build: ../../mailer
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-aprentix}@db:5432/${POSTGRES_DB:-aprentix}
      PGPASSWORD:  ${DB_PASS}
      SMTP_HOST:   ${SMTP_HOST:-}
      SMTP_PORT:   ${SMTP_PORT:-587}
      SMTP_USER:   ${SMTP_USER:-}
      SMTP_PASS:   ${SMTP_PASS:-}
      SMTP_FROM:   ${SMTP_FROM:-Aprentix <hola@aprentix.es>}
      SMTP_TLS:    ${SMTP_TLS:-starttls}
      DEV_LOG_ONLY: ${MAILER_DEV_LOG_ONLY:-0}
    restart: unless-stopped
    networks: [dokploy-network]

networks:
  dokploy-network:
    external: true
