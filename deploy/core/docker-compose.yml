# =============================================================================
# Stack CORE ─ db + postgrest (+ pgadmin opcional).
#
# DB_ALIAS distingue despliegues coexistentes en el mismo Dokploy:
#   - DB_ALIAS vacío  → container `db`,        alias `db`,        router `aprentix-api`
#   - DB_ALIAS=desa   → container `db-desa`,   alias `db-desa`,   router `aprentix-api-desa`
#
# El sufijo se construye con la forma shell `${DB_ALIAS:+-${DB_ALIAS}}`
# (si DB_ALIAS está definido y no vacío, expande a `-<valor>`).  Así
# el mismo YAML sirve para producción (compatible con los nombres
# `db`, `postgrest`, `app` actuales) y para desa (`db-desa`, ...).
#
# Regla: el mismo DB_ALIAS en los 4 .env del mismo entorno.
#
# pgAdmin se despliega SOLO cuando `COMPOSE_PROFILES=pgadmin`.  Así el
# stack de producción arranca pgAdmin y desa NO — la misma instancia
# gestiona ambas BBDD (con dos entradas en `pgadmin/servers.json`).
#
# ─── Aislamiento de la BBDD ─────────────────────────────────────────
# La BBDD vive en `db-net-${DB_ALIAS:-prod}` (red privada del stack)
# y NO en `dokploy-network`.  Esto es imprescindible cuando coexisten
# prod y desa: si ambos db se registraran en dokploy-network como
# alias `db` (Compose añade siempre el service name como alias, sin
# poder desactivarlo), el hostname `db` resolvería en round-robin a
# las dos IPs, y la mitad de conexiones de cualquier cliente que
# pidiera `dbname=aprentix` caerían en `db-desa` produciendo el
# error "FATAL: database 'aprentix' does not exist".
#
# PostgREST y pgAdmin sí están en `dokploy-network` (para Traefik) Y
# en la red privada de su BBDD (para hablar con ella).  pgAdmin puede
# unirse a las dos redes privadas (prod + desa) para servir ambos
# entornos con una única instancia.
#
# Antes del primer despliegue: crea las redes privadas a mano.
#   docker network create db-net-prod
#   docker network create db-net-desa
# (Idempotente: si ya existen, `docker network create` avisa y sigue.)
# =============================================================================

services:

  # Service key `postgres` (NO `db`) a propósito: Compose añade el
  # service name como alias implícito en cada red donde el servicio
  # está.  Si lo llamáramos `db`, el `db-desa` de desa publicaría el
  # alias `db` en `db-net-desa`, y como pgAdmin (que vive en `db-net-desa`
  # además de `dokploy-network`) ve el alias `db` en ambas redes, el
  # DNS de Docker devuelve las dos IPs en round-robin — la mitad de
  # conexiones a "Host: db" (entrada prod del servers.json) caerían
  # en `db-desa` provocando  FATAL: database "aprentix" does not exist.
  # Con service key `postgres` el alias implícito por red es `postgres`
  # y el alias explícito `db`/`db-desa` es único por entorno.
  postgres:
    image: postgres:16
    container_name: db${DB_ALIAS:+-${DB_ALIAS}}
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:?POSTGRES_DB requerida}
      POSTGRES_USER:     ${POSTGRES_USER:-aprentix}
      POSTGRES_PASSWORD: ${DB_PASS:?DB_PASS requerida}
    command:
      - postgres
      - -c
      - app.jwt_secret=${JWT_SECRET:?JWT_SECRET requerida}
      - -c
      - app.admin_pass=${ADMIN_PASS:?ADMIN_PASS requerida}
      - -c
      - app.auth_pass=${AUTH_PASS:?AUTH_PASS requerida}
      - -c
      # La función app_url() usa este ajuste para construir enlaces públicos
      # de confirmación, también cuando la BBDD conserva un volumen antiguo.
      - app.app_url=https://${DOMINIO_LANDING:?DOMINIO_LANDING requerido}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ../../db/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    networks:
      db-net:
        # Alias explícito: cada BBDD escucha bajo `db` o `db-desa`
        # dentro de SU propia red privada.  Como la red es distinta
        # entre entornos, no hay colisión de nombres posible.
        aliases:
          - db${DB_ALIAS:+-${DB_ALIAS}}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aprentix} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgrest:
    image: postgrest/postgrest:v12.2.3
    container_name: postgrest${DB_ALIAS:+-${DB_ALIAS}}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # En la red privada `db-net` el hostname `db-<alias>` es único
      # por entorno, así que no hay ambigüedad de resolución.
      PGRST_DB_URI:                    postgres://autenticador@db${DB_ALIAS:+-${DB_ALIAS}}:5432/${POSTGRES_DB}
      PGPASSWORD:                      ${AUTH_PASS}
      PGRST_DB_ANON_ROLE:              web_anon
      PGRST_DB_SCHEMAS:                public
      PGRST_JWT_SECRET:                ${JWT_SECRET}
      PGRST_OPENAPI_SERVER_PROXY_URI:  https://${DOMINIO_API}
    restart: unless-stopped
    networks:
      # PostgREST vive en las dos redes: la privada de la BBDD (para
      # hablar con `db`) y `dokploy-network` (para que Traefik le
      # llegue por el router HTTPS).
      db-net:
      dokploy-network:
        aliases:
          - postgrest${DB_ALIAS:+-${DB_ALIAS}}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.aprentix-api${DB_ALIAS:+-${DB_ALIAS}}.rule=Host(`${DOMINIO_API}`)"
      - "traefik.http.routers.aprentix-api${DB_ALIAS:+-${DB_ALIAS}}.entrypoints=websecure"
      - "traefik.http.routers.aprentix-api${DB_ALIAS:+-${DB_ALIAS}}.tls=true"
      - "traefik.http.routers.aprentix-api${DB_ALIAS:+-${DB_ALIAS}}.tls.certresolver=letsencrypt"
      - "traefik.http.routers.aprentix-api${DB_ALIAS:+-${DB_ALIAS}}.service=aprentix-api${DB_ALIAS:+-${DB_ALIAS}}"
      - "traefik.http.services.aprentix-api${DB_ALIAS:+-${DB_ALIAS}}.loadbalancer.server.port=3000"

  # pgAdmin ─ SOLO se levanta cuando COMPOSE_PROFILES=pgadmin (típico
  # en el .env de producción).  El servers.json del repo trae ya las
  # entradas de `db` (prod) y `db-desa`, así que la misma instancia
  # sirve para las dos BBDD sin duplicar pgAdmin.
  #
  # Para que pueda ver ambas BBDD, pgAdmin se une a las DOS redes
  # privadas (db-net-prod y db-net-desa).  Ambas se declaran external:
  # true, así que deben existir antes de arrancar (ver cabecera).
  pgadmin:
    image: dpage/pgadmin4:9
    container_name: pgadmin
    profiles: [pgadmin]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL:    ${PGADMIN_EMAIL:-admin@aprentix.es}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASS:-cambia_esto}
      PGADMIN_CONFIG_PROXY_X_FOR_COUNT:    "1"
      PGADMIN_CONFIG_PROXY_X_PROTO_COUNT:  "1"
      PGADMIN_CONFIG_PROXY_X_HOST_COUNT:   "1"
      PGADMIN_CONFIG_PROXY_X_PORT_COUNT:   "1"
      PGADMIN_CONFIG_PROXY_X_PREFIX_COUNT: "1"
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ../../pgadmin/servers.json:/pgadmin4/servers.json:ro
    restart: unless-stopped
    networks:
      # Traefik (público)
      dokploy-network:
      # BBDD de prod (siempre esperada cuando el profile pgadmin
      # está activo, porque va en el mismo stack).
      db-net:
      # BBDD de desa (opcional en runtime: si el stack desa no está
      # desplegado la red no existe y este servicio no arrancará).
      # Si NO usas entorno desa, comenta esta línea.
      db-net-desa-remote:
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.aprentix-pgadmin.rule=Host(`${DOMINIO_PGADMIN:-pgadmin.aprentix.es}`)"
      - "traefik.http.routers.aprentix-pgadmin.entrypoints=websecure"
      - "traefik.http.routers.aprentix-pgadmin.tls=true"
      - "traefik.http.routers.aprentix-pgadmin.tls.certresolver=letsencrypt"
      - "traefik.http.services.aprentix-pgadmin.loadbalancer.server.port=80"

volumes:
  pg_data:
  pgadmin_data:

networks:
  # Red pública compartida donde vive Traefik y las apps HTTP.
  dokploy-network:
    external: true

  # Red PRIVADA del stack — solo db, postgrest, mailer, notificador
  # y backups del mismo entorno la ven.  Nombre estable por entorno
  # (db-net-prod, db-net-desa) para poder referenciarla desde los
  # otros stacks del mismo entorno.
  db-net:
    external: true
    name: db-net-${DB_ALIAS:-prod}

  # Referencia a la red privada del OTRO entorno (solo la usa
  # pgAdmin para poder consultar ambas BBDD desde una única
  # instancia).  Nombre fijo `db-net-desa` porque prod es quien
  # aloja pgAdmin.
  db-net-desa-remote:
    external: true
    name: db-net-desa
