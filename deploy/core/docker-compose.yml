# =============================================================================
# Stack CORE ─ db + postgrest (+ pgadmin opcional).
#
# DB_ALIAS distingue despliegues coexistentes en el mismo Dokploy:
#   - DB_ALIAS vacío  → container `db`,        alias `db`,        router `aprentix-api`
#   - DB_ALIAS=desa   → container `db-desa`,   alias `db-desa`,   router `aprentix-api-desa`
#
# El sufijo se construye con la forma shell `${DB_ALIAS:+-${DB_ALIAS}}`
# (si DB_ALIAS está definido y no vacío, expande a `-<valor>`).  Así
# el mismo YAML sirve para producción (compatible con los nombres
# `db`, `postgrest`, `app` actuales) y para desa (`db-desa`, ...).
#
# Regla: el mismo DB_ALIAS en los 4 .env del mismo entorno.
#
# pgAdmin se despliega SOLO cuando `COMPOSE_PROFILES=pgadmin`.  Así el
# stack de producción arranca pgAdmin y desa NO — la misma instancia
# gestiona ambas BBDD (con dos entradas en `pgadmin/servers.json`).
# =============================================================================

services:

  db:
    image: postgres:16
    container_name: db${DB_ALIAS:+-${DB_ALIAS}}
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:?POSTGRES_DB requerida}
      POSTGRES_USER:     ${POSTGRES_USER:-aprentix}
      POSTGRES_PASSWORD: ${DB_PASS:?DB_PASS requerida}
    command:
      - postgres
      - -c
      - app.jwt_secret=${JWT_SECRET:?JWT_SECRET requerida}
      - -c
      - app.admin_pass=${ADMIN_PASS:?ADMIN_PASS requerida}
      - -c
      - app.auth_pass=${AUTH_PASS:?AUTH_PASS requerida}
      - -c
      # La función app_url() usa este ajuste para construir enlaces públicos
      # de confirmación, también cuando la BBDD conserva un volumen antiguo.
      - app.app_url=https://${DOMINIO_LANDING:?DOMINIO_LANDING requerido}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ../../db/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    networks:
      dokploy-network:
        # Alias explícito: reemplaza al default (service name = `db`)
        # y evita que dos deploys (prod + desa) compitan por el mismo
        # hostname DNS en la red compartida.
        aliases:
          - db${DB_ALIAS:+-${DB_ALIAS}}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aprentix} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgrest:
    image: postgrest/postgrest:v12.2.3
    container_name: postgrest${DB_ALIAS:+-${DB_ALIAS}}
    depends_on:
      db:
        condition: service_healthy
    environment:
      # La red de Dokploy es compartida por prod y desa. Usar `db` aquí
      # resulta ambiguo porque Compose publica ese alias de servicio para
      # ambos proyectos; el alias explícito garantiza que cada PostgREST se
      # conecte a la base de datos de su propio entorno.
      PGRST_DB_URI:                    postgres://autenticador@db${DB_ALIAS:+-${DB_ALIAS}}:5432/${POSTGRES_DB}
      PGPASSWORD:                      ${AUTH_PASS}
      PGRST_DB_ANON_ROLE:              web_anon
      PGRST_DB_SCHEMAS:                public
      PGRST_JWT_SECRET:                ${JWT_SECRET}
      PGRST_OPENAPI_SERVER_PROXY_URI:  https://${DOMINIO_API}
    restart: unless-stopped
    networks:
      dokploy-network:
        aliases:
          - postgrest${DB_ALIAS:+-${DB_ALIAS}}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.aprentix-api${DB_ALIAS:+-${DB_ALIAS}}.rule=Host(`${DOMINIO_API}`)"
      - "traefik.http.routers.aprentix-api${DB_ALIAS:+-${DB_ALIAS}}.entrypoints=websecure"
      - "traefik.http.routers.aprentix-api${DB_ALIAS:+-${DB_ALIAS}}.tls=true"
      - "traefik.http.routers.aprentix-api${DB_ALIAS:+-${DB_ALIAS}}.tls.certresolver=letsencrypt"
      - "traefik.http.routers.aprentix-api${DB_ALIAS:+-${DB_ALIAS}}.service=aprentix-api${DB_ALIAS:+-${DB_ALIAS}}"
      - "traefik.http.services.aprentix-api${DB_ALIAS:+-${DB_ALIAS}}.loadbalancer.server.port=3000"

  # pgAdmin ─ SOLO se levanta cuando COMPOSE_PROFILES=pgadmin (típico
  # en el .env de producción).  El servers.json del repo trae ya las
  # entradas de `db` (prod) y `db-desa`, así que la misma instancia
  # sirve para las dos BBDD sin duplicar pgAdmin.
  pgadmin:
    image: dpage/pgadmin4:9
    container_name: pgadmin
    profiles: [pgadmin]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL:    ${PGADMIN_EMAIL:-admin@aprentix.es}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASS:-cambia_esto}
      PGADMIN_CONFIG_PROXY_X_FOR_COUNT:    "1"
      PGADMIN_CONFIG_PROXY_X_PROTO_COUNT:  "1"
      PGADMIN_CONFIG_PROXY_X_HOST_COUNT:   "1"
      PGADMIN_CONFIG_PROXY_X_PORT_COUNT:   "1"
      PGADMIN_CONFIG_PROXY_X_PREFIX_COUNT: "1"
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ../../pgadmin/servers.json:/pgadmin4/servers.json:ro
    restart: unless-stopped
    networks: [dokploy-network]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.aprentix-pgadmin.rule=Host(`${DOMINIO_PGADMIN:-pgadmin.aprentix.es}`)"
      - "traefik.http.routers.aprentix-pgadmin.entrypoints=websecure"
      - "traefik.http.routers.aprentix-pgadmin.tls=true"
      - "traefik.http.routers.aprentix-pgadmin.tls.certresolver=letsencrypt"
      - "traefik.http.services.aprentix-pgadmin.loadbalancer.server.port=80"

volumes:
  pg_data:
  pgadmin_data:

networks:
  dokploy-network:
    external: true
