# =============================================================================
# Stack CORE ─ el estado (Postgres) y la API (PostgREST).
#
# Redespliega este stack cuando cambies:
#   - db/init/01_esquema.sql
#   - la versión de PostgREST
#
# Nombres de servicio neutros (`db`, `postgrest`), sin `container_name`:
# Dokploy los aísla por proyecto y en `dokploy-network` se resuelven
# por el alias del nombre del servicio, exactamente igual que en el
# stack de producción.  Cambiar la rama y desplegar es la operación
# equivalente en cualquier entorno.
# =============================================================================

services:

  db:
    image: postgres:16
    environment:
      POSTGRES_DB:       ${DB_NAME:?DB_NAME requerida}
      POSTGRES_USER:     aprentix
      POSTGRES_PASSWORD: ${DB_PASS:?DB_PASS requerida}
    command:
      - postgres
      - -c
      - app.jwt_secret=${JWT_SECRET:?JWT_SECRET requerida}
      - -c
      - app.admin_pass=${ADMIN_PASS:?ADMIN_PASS requerida}
      - -c
      - app.auth_pass=${AUTH_PASS:?AUTH_PASS requerida}
    volumes:
      # Volumen nombrado (scoped por proyecto en Dokploy).
      - pg_data:/var/lib/postgresql/data
      - ../../db/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    networks: [dokploy-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aprentix -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgrest:
    image: postgrest/postgrest:v12.2.3
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI:                    postgres://autenticador@db:5432/${DB_NAME}
      PGPASSWORD:                      ${AUTH_PASS}
      PGRST_DB_ANON_ROLE:              web_anon
      PGRST_DB_SCHEMAS:                public
      PGRST_JWT_SECRET:                ${JWT_SECRET}
      PGRST_OPENAPI_SERVER_PROXY_URI:  https://${DOMINIO_API}
    restart: unless-stopped
    networks: [dokploy-network]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.aprentix-api.rule=Host(`${DOMINIO_API}`)"
      - "traefik.http.routers.aprentix-api.entrypoints=websecure"
      - "traefik.http.routers.aprentix-api.tls=true"
      - "traefik.http.routers.aprentix-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.aprentix-api.loadbalancer.server.port=3000"

volumes:
  pg_data:

networks:
  dokploy-network:
    external: true
