# ─────────────────────────────────────────────────────────────────────────────
# Stack CORE — variante para el ENTORNO `desarrollo` de Dokploy.
#
# Convivencia con producción
# ---------------------------
# Este fichero vive en la rama `desa` y sólo lo despliega el entorno
# `desarrollo` de Dokploy. Producción (entorno `produccion`, rama `main`)
# usa SU PROPIO fichero de la rama `main`, que incluye `db` y `pgadmin`.
#
# En desarrollo NO desplegamos ni `db` ni `pgadmin`:
#   - Hay UN único cluster Postgres (el del stack `core` de producción)
#     con dos BDs dentro: `aprentix` (prod) y `aprentix_desa` (desa).
#     Levantar aquí un segundo `db` intentaría escribir en el mismo
#     bind mount `/mnt/data/pg` y corromper los datos.
#   - Sólo hay UN pgAdmin (el de producción). Ese pgAdmin ya ve ambas
#     BDs porque están en el mismo cluster; sólo hay que darlas de alta
#     como dos servers dentro del panel (ver pgadmin/servers.json).
#
# Además renombramos `postgrest` → `postgrest_desa` y `mailer` → `mailer_desa`.
# La razón es que el alias DNS de un servicio en la red externa
# `dokploy-network` coincide con su nombre de servicio, y no se puede
# suprimir: si dos stacks tuviesen un servicio llamado `postgrest`, los
# clientes que hicieran `postgrest:3000` recibirían round-robin entre
# los dos → bug silencioso apuntando a la BD equivocada.
#
# MERGE NOTE (cuando esta rama vuelva a `main`):
#   Producción sigue necesitando `db` y `pgadmin` en su compose. La forma
#   más limpia al mergear es NO propagar la eliminación de estos servicios
#   al fichero de `main`, y en su lugar dejar dos ficheros distintos:
#     - `deploy/core/docker-compose.prod.yml` (con db, pgadmin, postgrest, mailer)
#     - `deploy/core/docker-compose.desa.yml` (este mismo fichero)
#   Cada entorno de Dokploy apunta al que le toca en el campo "Compose path".
#   Alternativa: usar `profiles: ["prod"]` en db/pgadmin dentro de un único
#   fichero y activar `COMPOSE_PROFILES=prod` sólo en el entorno de producción.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # NOTA: El servicio `db` NO se define aquí a propósito. En el entorno
  # `desarrollo` los servicios de abajo se conectan por la red externa
  # `dokploy-network` al `db` levantado por el stack `core` de producción
  # (misma red compartida). El compose de producción sigue teniendo el
  # servicio `db` en su versión de la rama `main`.

  # NOTA: El servicio `pgadmin` tampoco se define aquí. El pgAdmin de
  # producción es el único, y ya alcanza AMBAS BDs (aprentix y
  # aprentix_desa) porque viven en el mismo cluster Postgres.

  postgrest_desa:
    image: postgrest/postgrest:v12.2.3
    environment:
      # Conecta al `db` de producción por su alias DNS en dokploy-network.
      # POSTGRES_DB debe ser `aprentix_desa` en las variables de este stack.
      PGRST_DB_URI: postgres://autenticador@db:5432/${POSTGRES_DB:-aprentix_desa}
      PGPASSWORD: ${AUTH_PASS:?AUTH_PASS requerida}
      PGRST_DB_ANON_ROLE: web_anon
      PGRST_DB_SCHEMAS: public
      # JWT_SECRET obligatoriamente el MISMO que el del stack `core` de
      # producción: los GUCs `app.jwt_secret`/`app.auth_pass`/`app.admin_pass`
      # los fija el postgres de prod en su `command` y son cluster-wide;
      # PostgREST de desa firma/valida contra ese mismo secreto.
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_OPENAPI_SERVER_PROXY_URI: https://${DOMINIO_API:-api.desa.aprentix.es}
    restart: unless-stopped
    networks: [dokploy-network]
    labels:
      - "traefik.enable=true"
      # Router y middleware llevan sufijo `-desa` para no colisionar con
      # los del stack `core` de producción (Traefik dedupe routers por
      # nombre y sólo se queda con uno).
      - "traefik.http.routers.api-desa.rule=Host(`${DOMINIO_API:?DOMINIO_API requerido (p.ej. api.desa.aprentix.es)}`)"
      - "traefik.http.routers.api-desa.entrypoints=websecure"
      - "traefik.http.routers.api-desa.tls=true"
      - "traefik.http.routers.api-desa.tls.certresolver=letsencrypt"
      - "traefik.http.services.api-desa.loadbalancer.server.port=3000"
      - "traefik.http.middlewares.api-rl-desa.ratelimit.average=100"
      - "traefik.http.middlewares.api-rl-desa.ratelimit.burst=50"
      - "traefik.http.middlewares.api-rl-desa.ratelimit.period=1m"
      - "traefik.http.routers.api-desa.middlewares=api-rl-desa"

  # Mailer de desarrollo. Escucha el canal LISTEN `email_enviar` sobre
  # `aprentix_desa` (per-conexión → no compite con el mailer de prod, que
  # escucha sobre `aprentix`). Recomendado: en desa dejar
  # MAILER_DEV_LOG_ONLY=1 y ver los correos en logs sin enviar de verdad.
  mailer_desa:
    build: ../../mailer
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-aprentix}@db:5432/${POSTGRES_DB:-aprentix_desa}
      PGPASSWORD:  ${DB_PASS}
      SMTP_HOST:   ${SMTP_HOST:-}
      SMTP_PORT:   ${SMTP_PORT:-587}
      SMTP_USER:   ${SMTP_USER:-}
      SMTP_PASS:   ${SMTP_PASS:-}
      SMTP_FROM:   ${SMTP_FROM:-Aprentix DESA <hola@aprentix.es>}
      SMTP_TLS:    ${SMTP_TLS:-starttls}
      DEV_LOG_ONLY: ${MAILER_DEV_LOG_ONLY:-1}
    restart: unless-stopped
    networks: [dokploy-network]

networks:
  dokploy-network:
    external: true
