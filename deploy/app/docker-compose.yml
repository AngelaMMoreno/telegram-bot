# Stack APP — SPA rediseñada /estudio/ + backend FastAPI de contenidos
# en un solo contenedor.
#
# Es el único modo soportado ya. Los stacks segmentados de landing/, web/
# y teoria/ se retiraron al unificar el frontend bajo /estudio/: hoy hay
# un único Dockerfile que empaqueta la SPA y el backend en una sola
# imagen.
#
# Habla con PostgREST (stack core) por http://postgrest:3000 en la red
# externa dokploy-network.

services:

  app:
    build:
      context: ../..
      dockerfile: deploy/app/Dockerfile
    environment:
      # El backend de teoría necesita el mismo JWT_SECRET que Postgres
      # para validar los tokens que emite PostgREST.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requerida}
      BASE_DIR: /ficheros
      POSTGREST_URL: http://postgrest:3000
    volumes:
      # Los ficheros de teoría (PDFs, markdown, etc.) viven fuera del
      # contenedor para sobrevivir a redespliegues.
      - /mnt/data/ficheros:/ficheros
    restart: unless-stopped
    networks: [dokploy-network]
    labels:
      - "traefik.enable=true"

      # ── Router principal: dominio(s) donde vive la SPA ────────────
      # `DOMINIO_LANDING` es OBLIGATORIO y no tiene default: así cada
      # rama (prod → aprentix.es, dev → desa.aprentix.es, etc.) puede
      # desplegarse contra un host distinto sin colisionar con la otra.
      # `DOMINIO_LANDING_ALT` es opcional; si no se define, cae al mismo
      # valor que el principal (regla duplicada e inofensiva).
      - "traefik.http.routers.app.rule=Host(`${DOMINIO_LANDING:?DOMINIO_LANDING requerido (p.ej. aprentix.es o desa.aprentix.es)}`) || Host(`${DOMINIO_LANDING_ALT:-${DOMINIO_LANDING}}`)"
      - "traefik.http.routers.app.entrypoints=websecure"
      - "traefik.http.routers.app.tls=true"
      - "traefik.http.routers.app.tls.certresolver=letsencrypt"
      - "traefik.http.services.app.loadbalancer.server.port=80"

      # ── Redirect legacy: test.aprentix.es → aplicación remodelada ─
      # Los hosts legacy sólo se dan de alta si TÚ pones un valor real;
      # los defaults son `.invalid` (TLD reservada que nunca resuelve)
      # para que en despliegues nuevos —típicamente `desa.aprentix.es`—
      # no se pise el `test.aprentix.es` del despliegue de producción.
      - "traefik.http.routers.web-legacy.rule=Host(`${DOMINIO_WEB:-legacy-web-desactivado.invalid}`) || Host(`${DOMINIO_WEB_ALT:-legacy-web-alt-desactivado.invalid}`)"
      - "traefik.http.routers.web-legacy.entrypoints=websecure"
      - "traefik.http.routers.web-legacy.tls=true"
      - "traefik.http.routers.web-legacy.tls.certresolver=letsencrypt"
      - "traefik.http.routers.web-legacy.middlewares=web-legacy-redirect"
      - "traefik.http.middlewares.web-legacy-redirect.redirectregex.regex=^https?://[^/]+/(.*)"
      - "traefik.http.middlewares.web-legacy-redirect.redirectregex.replacement=https://${DOMINIO_LANDING}/"
      - "traefik.http.middlewares.web-legacy-redirect.redirectregex.permanent=true"

      # ── Redirect legacy: teoria.aprentix.es → aplicación remodelada
      - "traefik.http.routers.teoria-legacy.rule=Host(`${DOMINIO_TEORIA:-legacy-teoria-desactivado.invalid}`) || Host(`${DOMINIO_TEORIA_ALT:-legacy-teoria-alt-desactivado.invalid}`)"
      - "traefik.http.routers.teoria-legacy.entrypoints=websecure"
      - "traefik.http.routers.teoria-legacy.tls=true"
      - "traefik.http.routers.teoria-legacy.tls.certresolver=letsencrypt"
      - "traefik.http.routers.teoria-legacy.middlewares=teoria-legacy-redirect"
      - "traefik.http.middlewares.teoria-legacy-redirect.redirectregex.regex=^https?://[^/]+/(.*)"
      - "traefik.http.middlewares.teoria-legacy-redirect.redirectregex.replacement=https://${DOMINIO_LANDING}/"
      - "traefik.http.middlewares.teoria-legacy-redirect.redirectregex.permanent=true"

networks:
  dokploy-network:
    external: true
