# =============================================================================
# Stack APP ─ Caddy + SPA.
#
# El Caddyfile lee POSTGREST_UPSTREAM (`postgrest-${DB_ALIAS}:3000`)
# para saber a qué stack `postgrest` proxyar.  La misma imagen sirve
# para prod y desa cambiando sólo el .env.
# =============================================================================

services:

  app:
    build:
      context: ../..
      dockerfile: deploy/app/Dockerfile
    container_name: app-${DB_ALIAS:?DB_ALIAS requerida}
    environment:
      POSTGREST_UPSTREAM: postgrest-${DB_ALIAS}:3000
    restart: unless-stopped
    networks:
      dokploy-network:
        aliases:
          - app-${DB_ALIAS}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      # Router acepta el dominio principal y (opcional) el alt (`www.`)
      - "traefik.http.routers.aprentix-web-${DB_ALIAS}.rule=Host(`${DOMINIO_LANDING}`) || Host(`${DOMINIO_LANDING_ALT:-www.dummy.invalid}`)"
      - "traefik.http.routers.aprentix-web-${DB_ALIAS}.entrypoints=websecure"
      - "traefik.http.routers.aprentix-web-${DB_ALIAS}.tls=true"
      - "traefik.http.routers.aprentix-web-${DB_ALIAS}.tls.certresolver=letsencrypt"
      - "traefik.http.routers.aprentix-web-${DB_ALIAS}.service=aprentix-web-${DB_ALIAS}"
      - "traefik.http.services.aprentix-web-${DB_ALIAS}.loadbalancer.server.port=80"

networks:
  dokploy-network:
    external: true
