# Stack PUBLICADOR — publica el repo de contenido en la BBDD, solo.
#
# Sustituye a lanzar `db/publicacion/publicar.py` a mano. Un contenedor de
# fondo con dcron que cada PUBLICAR_CRON clona el repo de contenido,
# compara con lo publicado y sube lo que haya cambiado. Es idempotente:
# las corridas en las que no ha cambiado nada no tocan la BBDD.
#
# Mismo patrón que el stack `backups`: un dcron en foreground, la hora por
# variable de entorno y todo a `docker logs`.
#
# NO es un sistema de CI. Publica lo que ya está en la rama que le digas,
# es decir, lo que alguien ya revisó y mergeó. La revisión previa sigue
# siendo cosa del PR.
#
# ── VARIANTE DESA (rama `desa`, entorno Dokploy `desarrollo`) ─────────
# Los valores por defecto de este fichero son los de DESARROLLO:
#   - `CONTENIDO_RAMA` = `desa`  → publica la rama de contenido en curso.
#   - El DSN debe apuntar a `aprentix_desa`, NO a `aprentix`.
#
# Así el contenido recorre el mismo camino que el código: se mergea a
# `desa`, se publica en `aprentix_desa`, se comprueba en
# desa.aprentix.es y sólo entonces se mergea a `main` para que el
# publicador de producción lo suba a `aprentix`. Con contenido generado
# con ayuda de una IA, ese escalón intermedio es justamente donde se ven
# los destrozos antes de que los vea un opositor.
#
# MERGE NOTE (al mergear a `main`): cambiar `CONTENIDO_RAMA` a `main` y
# el DSN a la BD `aprentix`. Igual que en deploy/core y deploy/app,
# mantener DOS ficheros distintos por entorno o conmutar con
# `COMPOSE_PROFILES`.
#
# El nombre de servicio `publicador` se deja igual en los dos entornos:
# nadie lo resuelve por DNS desde otro stack —sólo hace conexiones de
# salida—, así que el alias duplicado en dokploy-network es inocuo. Es el
# mismo criterio que con el servicio `app`.
#
# Se conecta a la BBDD del stack core por la red externa dokploy-network
# usando el hostname `db` (el Postgres único de producción, que aloja las
# dos bases). Depende de que core-prod esté levantado.

services:

  publicador:
    build:
      # Contexto = raíz del repo, porque el script vive en db/publicacion/.
      # Mismo enfoque que deploy/app.
      context: ../..
      dockerfile: deploy/publicador/Dockerfile
    # crond (BusyBox) llama a setpgid(0,0) al arrancar y el kernel se lo
    # prohíbe como PID 1. `init: true` mete tini delante. Ver la nota
    # larga en deploy/backups/docker-compose.yml.
    init: true
    environment:
      # ── Repo de contenido ──────────────────────────────────────────
      # Si es privado, mete el token en la URL:
      #   https://x-access-token:<TOKEN>@github.com/tu-cuenta/oposiciones.git
      # El token NO aparece en los logs: tanto el entrypoint como el
      # propio publicar.py lo tapan antes de imprimir nada.
      CONTENIDO_REPO: ${CONTENIDO_REPO:?URL del repo de contenido}
      # Publica sólo lo mergeado. En desa, la rama `desa`; en producción,
      # `main`. Si tu repo de contenido usa otros nombres de rama, aquí
      # es donde se ajusta.
      CONTENIDO_RAMA: ${CONTENIDO_RAMA:-desa}

      # ── Base de datos ──────────────────────────────────────────────
      # DSN completo. La contraseña es la misma que usa el stack core: hay
      # un solo rol `aprentix` para las dos bases.
      # DESA → aprentix_desa   ·   PRODUCCIÓN → aprentix
      PUBLICAR_DSN: ${PUBLICAR_DSN:?DSN de la BBDD, p.ej. postgres://aprentix:PASS@db:5432/aprentix_desa}

      # ── Qué y cuándo ───────────────────────────────────────────────
      # Cinco campos cron. Por defecto cada 15 min: el contenido no es
      # urgente y una corrida sin cambios no toca la BBDD.
      PUBLICAR_CRON: ${PUBLICAR_CRON:-*/15 * * * *}
      # Vacío = publica todas las oposiciones del repo. Para acotar, una
      # lista separada por espacios: "auxilio-judicial gestion-procesal".
      PUBLICAR_OPOSICIONES: ${PUBLICAR_OPOSICIONES:-}

      # ── Interruptor de seguridad ───────────────────────────────────
      # SIN esta variable el contenedor sólo hace SIMULACROS: enseña en
      # los logs qué publicaría y no escribe. Míralos un par de días y
      # ponla a 1 cuando el plan te cuadre.
      PUBLICAR_APLICAR: ${PUBLICAR_APLICAR:-}
      # Corrida al arrancar además de la programada, para ver enseguida
      # si la configuración es correcta. Ponla a 0 para desactivarla.
      PUBLICAR_AL_ARRANCAR: ${PUBLICAR_AL_ARRANCAR:-1}

      # ── Aviso por email ────────────────────────────────────────────
      # MUY recomendable si no pasas el contenido por ningún CI: sin
      # esto, un merge que rompa la plantilla para la publicación en
      # silencio dentro de un contenedor que nadie mira.
      #
      # Sólo se avisa en los CAMBIOS de estado (empieza a fallar / vuelve
      # a funcionar), no en cada corrida. Las credenciales SMTP son las
      # mismas del stack `mailer`.
      AVISO_EMAIL: ${AVISO_EMAIL:-}
      SMTP_HOST:   ${SMTP_HOST:-}
      SMTP_PORT:   ${SMTP_PORT:-587}
      SMTP_USER:   ${SMTP_USER:-}
      SMTP_PASS:   ${SMTP_PASS:-}
      SMTP_FROM:   ${SMTP_FROM:-Aprentix <hola@aprentix.es>}
      SMTP_TLS:    ${SMTP_TLS:-starttls}

      TZ: ${TZ:-Europe/Madrid}

    restart: unless-stopped
    networks: [dokploy-network]

networks:
  dokploy-network:
    external: true
