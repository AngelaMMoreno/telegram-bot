# =============================================================================
# Stack NOTIFICADOR ─ worker Web Push.
#
# Consume `cola_push` de la BBDD.  Alcanza al `db` del stack CORE
# del MISMO entorno vía el alias `db${STACK_SUFFIX}` en dokploy-network.
# =============================================================================

services:

  notificador:
    build:
      context: ../../notificador
      dockerfile: Dockerfile
    container_name: notificador${STACK_SUFFIX}
    environment:
      DATABASE_URL:      postgres://aprentix@db${STACK_SUFFIX}:5432/${DB_NAME}
      PGPASSWORD:        ${DB_PASS}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_PUBLIC_KEY:  ${VAPID_PUBLIC_KEY:-}
      VAPID_SUBJECT:     ${VAPID_SUBJECT:-mailto:soporte@aprentix.es}
      TICK_SECONDS:      ${NOTIF_TICK:-60}
      BATCH:             ${NOTIF_BATCH:-50}
      LOG_LEVEL:         ${NOTIF_LOG:-INFO}
    restart: unless-stopped
    networks:
      dokploy-network:
        aliases:
          - notificador${STACK_SUFFIX}

networks:
  dokploy-network:
    external: true
