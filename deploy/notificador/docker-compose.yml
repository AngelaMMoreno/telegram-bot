# =============================================================================
# Stack NOTIFICADOR ─ worker Web Push.
#
# Consume `cola_push` de la BBDD del stack core del mismo entorno.
# Se une a la red PRIVADA del stack (`db-net-${DB_ALIAS:-prod}`) para
# hablar con `db` o `db-desa` — la red pública `dokploy-network` NO
# ve la BBDD (ver comentario en deploy/core/docker-compose.yml).
#
# Prerrequisito: la red `db-net-<alias>` debe existir (la crea el
# core al arrancar).  Si por lo que sea despliegas primero el
# notificador, créala a mano:  `docker network create db-net-desa`.
# =============================================================================

services:

  notificador:
    build:
      context: ../../notificador
      dockerfile: Dockerfile
    container_name: notificador${DB_ALIAS:+-${DB_ALIAS}}
    environment:
      DATABASE_URL:      postgres://${POSTGRES_USER:-aprentix}@db${DB_ALIAS:+-${DB_ALIAS}}:5432/${POSTGRES_DB}
      PGPASSWORD:        ${DB_PASS}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_PUBLIC_KEY:  ${VAPID_PUBLIC_KEY:-}
      VAPID_SUBJECT:     ${VAPID_SUBJECT:-mailto:soporte@aprentix.es}
      TICK_SECONDS:      ${TICK_SECONDS:-300}
      BATCH_LIMIT:       ${BATCH_LIMIT:-500}
      LOG_LEVEL:         ${LOG_LEVEL:-INFO}
      ENCOLAR_MINUTOS:   ${ENCOLAR_MINUTOS:-15}
      CRON_SEMANAL_HORA: ${CRON_SEMANAL_HORA:-3}
    restart: unless-stopped
    networks:
      # Solo red privada — no expone HTTP.
      db-net:

networks:
  db-net:
    external: true
    name: db-net-${DB_ALIAS:-prod}
