# Compose maestro del entorno DESA — SIN backups y SIN pgadmin.
#
# El pgadmin se comparte con el stack de producción; solo hay que
# actualizar `pgadmin/servers.json` con una segunda entrada
# (`aprentix-desa` → host `db-desa`) para poder navegarlo desde el
# mismo panel.
#
# Requiere Docker Compose 2.20 o superior (por `include:`).

include:
  - core/docker-compose.yml
  - app/docker-compose.yml
  - mailer/docker-compose.yml
  - notificador/docker-compose.yml
